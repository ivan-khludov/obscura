services:
  e2e-server:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile
    hostname: e2e-server
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./bootstrap-server.sh:/usr/local/bin/e2e-bootstrap.sh:ro
    tmpfs:
      - /run
      - /run/lock
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    stop_signal: SIGRTMIN+3
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-system-running | grep -qE 'running|degraded'"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 30s

  e2e-client:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    depends_on:
      e2e-server:
        condition: service_healthy

  target:
    image: nginx:alpine

  handshake:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.handshake
    hostname: handshake
