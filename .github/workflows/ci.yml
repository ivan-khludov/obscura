  e2e-trojan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./test/e2e/trojan/... -tags=e2e -count=1 -timeout 20m

  e2e-wireguard:
